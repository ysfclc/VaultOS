name: VaultOS Android Build

on:
  push:
    branches:
      - "**"
    paths:
      - "incoming/VaultOS-source.zip"
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vaultos-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Test, lint and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract uploaded full-repository ZIP (if present)
        if: github.event_name != 'pull_request'
        id: source_zip
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="incoming/VaultOS-source.zip"
          if [ ! -f "$ZIP_PATH" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No incoming/VaultOS-source.zip found; building the checked-out repository."
            exit 0
          fi
          ZIP_SHA="$(sha256sum "$ZIP_PATH" | cut -d ' ' -f1)"
          mkdir -p .vaultos
          if [ -f .vaultos/last-source-zip.sha256 ] && [ "$(cat .vaultos/last-source-zip.sha256)" = "$ZIP_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "This exact source ZIP was already extracted."
            exit 0
          fi
          TEMP_DIR="$(mktemp -d)"
          unzip -q "$ZIP_PATH" -d "$TEMP_DIR"
          SETTINGS_FILE="$(find "$TEMP_DIR" -name settings.gradle.kts -type f -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ZIP does not contain a Gradle Android project (settings.gradle.kts missing)." >&2
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] || [ ! -f "$PROJECT_DIR/README.md" ]; then
            echo "ZIP is not a complete VaultOS source repository." >&2
            exit 1
          fi
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='incoming/' \
            --exclude='.vaultos/' \
            --exclude='docs/updates/' \
            --exclude='.github/workflows/android-build.yml' \
            "$PROJECT_DIR/" ./
          if [ -f android-build.yml ]; then
            mkdir -p .github/workflows
            cp android-build.yml .github/workflows/android-build.yml
          fi
          printf '%s\n' "$ZIP_SHA" > .vaultos/last-source-zip.sha256
          mkdir -p docs/updates
          cat > "docs/updates/zip-import-${GITHUB_RUN_NUMBER}.md" <<NOTE
          # Source ZIP imported

          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Uploaded file: ${ZIP_PATH}
          - SHA-256: ${ZIP_SHA}
          - Imported at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Source project: VaultOS Android repository

          The complete source archive was validated and extracted over the repository. The original ZIP remains in incoming/ for traceability.
          NOTE
          rm -rf "$TEMP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import VaultOS source ZIP ${GITHUB_RUN_NUMBER}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests, lint and assemble
        run: gradle --no-daemon clean testDebugUnitTest lintDebug assembleDebug

      - name: Prepare APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/VaultOS-debug.apk
          cd dist
          sha256sum VaultOS-debug.apk > SHA256SUMS.txt
          {
            echo "VaultOS 0.1.0"
            echo "Build: ${GITHUB_RUN_NUMBER}"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Variant: debug (debug key; suitable for sideload testing)"
            echo "Target SDK: 35"
            echo "Minimum SDK: 26"
          } > BUILD-INFO.txt

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VaultOS-debug-APK
          path: dist/VaultOS-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload checksum and build information
        uses: actions/upload-artifact@v4
        with:
          name: VaultOS-build-metadata
          path: |
            dist/SHA256SUMS.txt
            dist/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30

      - name: Add build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VaultOS Android build"
            echo "- Device target: Redmi Note 12 Pro 5G / Android 13+"
            echo "- Compile SDK: 35"
            echo "- Java: 17"
            echo "- Gradle: 8.9"
            if [ -f dist/SHA256SUMS.txt ]; then
              echo "- APK SHA-256: $(cut -d ' ' -f1 dist/SHA256SUMS.txt)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VaultOS-build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
