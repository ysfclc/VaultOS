name: VaultOS Android Build

on:
  push:
    branches:
      - "**"
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/android-build.yml"
      - "android-build.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vaultos-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Test and lint (no APK signing)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify build variants do not reference exposed signing identity
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'vaultos-stable\.keystore|vaultosStable|storePassword|keyPassword' app/build.gradle.kts; then
            echo "CI must not reference the exposed historical signing identity." >&2
            exit 1
          fi

      - name: Enforce Android 13+ minimum SDK policy
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^[[:space:]]*minSdk[[:space:]]*=[[:space:]]*33([[:space:]]|$)' app/build.gradle.kts || {
            echo "Future VaultOS releases must require Android 13 (API 33) or newer." >&2
            exit 1
          }

      - name: Run unit tests and lint without signing
        run: gradle --no-daemon clean testDebugUnitTest lintDebug

      - name: Add build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VaultOS Android validation"
            echo "- JVM unit tests and Android lint only"
            echo "- No release APK is assembled, signed, uploaded or published"
            echo "- API 35 instrumentation builds test-only APKs with the generated default debug signer"
            echo "- Release signing is disabled pending verified replacement-key lineage"
            echo "- Minimum supported Android for future releases: API 33+"\n            echo "- Compile SDK: 35"
            echo "- Java: 17"
            echo "- Gradle: 8.9"
          } >> "$GITHUB_STEP_SUMMARY"

  android-instrumentation:
    name: Android API 35 instrumentation
    runs-on: macos-26-intel
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify instrumentation does not use exposed signer
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'vaultos-stable\.keystore|vaultosStable|storePassword|keyPassword' app/build.gradle.kts; then
            echo "Instrumentation must not use the exposed historical signing identity." >&2
            exit 1
          fi

      - name: Run Android-backed typing memory tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            set +e
            gradle --no-daemon connectedDebugAndroidTest
            test_status=$?
            mkdir -p app/build/diagnostics
            adb logcat -d -b all -v threadtime > app/build/diagnostics/logcat.txt 2>&1 || true
            adb shell dumpsys activity instrumentation > app/build/diagnostics/instrumentation.txt 2>&1 || true
            adb shell dumpsys package com.vaultos.app > app/build/diagnostics/package.txt 2>&1 || true
            adb shell ps -A > app/build/diagnostics/processes.txt 2>&1 || true
            exit "$test_status"

      - name: Capture Android emulator boot diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p app/build/diagnostics
          adb devices -l > app/build/diagnostics/adb-devices.txt 2>&1 || true
          adb -s emulator-5554 shell getprop sys.boot_completed > app/build/diagnostics/boot-completed.txt 2>&1 || true
          adb -s emulator-5554 logcat -d -b all -v threadtime > app/build/diagnostics/boot-logcat.txt 2>&1 || true
          ps -Ao pid,ppid,stat,etime,command | grep -E '[e]mulator|[q]emu|[a]db' > app/build/diagnostics/emulator-processes.txt 2>&1 || true
          ls -la "$HOME/.android/avd" > app/build/diagnostics/avd-directory.txt 2>&1 || true
          find "$HOME/.android/avd" -type f -name config.ini -print -exec cat {} \; > app/build/diagnostics/avd-config.txt 2>&1 || true

      - name: Upload Android instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vaultos-instrumentation-diagnostics-${{ github.run_id }}
          path: |
            app/build/diagnostics/**
            app/build/reports/androidTests/connected/debug/**
            app/build/outputs/androidTest-results/connected/debug/**
          if-no-files-found: warn
          retention-days: 7
