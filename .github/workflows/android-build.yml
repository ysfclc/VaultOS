name: VaultOS Android Build

on:
  push:
    branches:
      - "**"
    paths:
      - "incoming/VaultOS-source.zip"
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/android-build.yml"
      - "android-build.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vaultos-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Test, lint and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Import uploaded full-repository ZIP
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="incoming/VaultOS-source.zip"
          if [ ! -f "$ZIP_PATH" ]; then
            echo "No incoming source ZIP found; using the checked-out repository."
            exit 0
          fi

          # Always inspect and extract the ZIP. Do not trust the previous SHA marker
          # as proof that the checked-out source still matches the uploaded archive.
          ZIP_SHA="$(sha256sum "$ZIP_PATH" | cut -d ' ' -f1)"
          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT
          unzip -q "$ZIP_PATH" -d "$TEMP_DIR"
          SETTINGS_FILE="$(find "$TEMP_DIR" -name settings.gradle.kts -type f -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Source ZIP is invalid: settings.gradle.kts is missing." >&2
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] || [ ! -f "$PROJECT_DIR/README.md" ]; then
            echo "Source ZIP is incomplete: app/build.gradle.kts or README.md is missing." >&2
            exit 1
          fi

          # Reject the known stale package before it can reach Gradle lint.
          KEYBOARD_FILE="$PROJECT_DIR/app/src/main/java/com/vaultos/app/keyboard/VaultKeyboardService.kt"
          if [ ! -f "$KEYBOARD_FILE" ]; then
            echo "Source ZIP is missing VaultKeyboardService.kt." >&2
            exit 1
          fi
          if grep -nE 'switchToNextInputMethod[[:space:]]*\(' "$KEYBOARD_FILE"; then
            echo "STALE SOURCE ZIP: VaultKeyboardService.kt still calls the API-28-only switchToNextInputMethod()." >&2
            echo "Upload the corrected VaultOS-source.zip; do not only dispatch this workflow." >&2
            echo "Rejected ZIP SHA-256: $ZIP_SHA" >&2
            exit 1
          fi

          # Reject a ZIP whose API-qualified theme loses the base theme parent/items.
          python3 - "$PROJECT_DIR/app/src/main/res/values/styles.xml" "$PROJECT_DIR/app/src/main/res/values-v27/styles.xml" <<'PYTHEME'
          import sys
          import xml.etree.ElementTree as ET
          base_root, v27_root = (ET.parse(path).getroot() for path in sys.argv[1:])
          def theme(root):
              matches = [node for node in root.findall("style") if node.get("name") == "Theme.VaultOS"]
              if len(matches) != 1:
                  raise SystemExit("Expected exactly one Theme.VaultOS style.")
              node = matches[0]
              return node, {item.get("name"): (item.text or "").strip() for item in node.findall("item")}
          base, base_items = theme(base_root)
          qualified, qualified_items = theme(v27_root)
          if qualified.get("parent") != base.get("parent"):
              raise SystemExit("values-v27 Theme.VaultOS must declare the same explicit parent as values/styles.xml.")
          missing = [name for name, value in base_items.items() if qualified_items.get(name) != value]
          if missing:
              raise SystemExit("values-v27 Theme.VaultOS is missing base theme items: " + ", ".join(missing))
          if qualified_items.get("android:windowLightNavigationBar") != "false":
              raise SystemExit("values-v27 Theme.VaultOS must set android:windowLightNavigationBar=false.")
          PYTHEME
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='incoming/' \
            --exclude='.vaultos/' \
            --exclude='docs/updates/' \
            --exclude='.github/workflows/android-build.yml' \
            --exclude='android-build.yml' \
            "$PROJECT_DIR/" ./

          mkdir -p .vaultos
          printf '%s\n' "$ZIP_SHA" > .vaultos/last-source-zip.sha256
          mkdir -p docs/updates
          cat > "docs/updates/zip-import-${GITHUB_RUN_NUMBER}.md" <<NOTE
          # Source ZIP imported

          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Uploaded file: ${ZIP_PATH}
          - SHA-256: ${ZIP_SHA}
          - Imported at: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          The uploaded source archive was validated and extracted over the repository. The original ZIP remains in incoming/ for traceability.
          NOTE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import VaultOS source ZIP ${GITHUB_RUN_NUMBER}"
            if [ "${GITHUB_REF_TYPE}" = "branch" ]; then
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          else
            echo "Uploaded source already matches the repository; no import commit needed."
          fi

      - name: Verify lint-critical source fixes
        shell: bash
        run: |
          set -euo pipefail
          KEYBOARD_FILE="app/src/main/java/com/vaultos/app/keyboard/VaultKeyboardService.kt"
          MAIN_FILE="app/src/main/java/com/vaultos/app/MainActivity.kt"
          MANIFEST="app/src/main/AndroidManifest.xml"
          BASE_STYLES="app/src/main/res/values/styles.xml"
          V27_STYLES="app/src/main/res/values-v27/styles.xml"

          test -f "$KEYBOARD_FILE"
          if grep -nE 'switchToNextInputMethod[[:space:]]*\(' "$KEYBOARD_FILE"; then
            echo "API-28-only switchToNextInputMethod() remains in the checked-out source." >&2
            exit 1
          fi
          if grep -n 'produceState(initialValue = emptyList<File>()' "$MAIN_FILE"; then
            echo "Stale Compose produceState folder loader remains in MainActivity.kt." >&2
            exit 1
          fi
          if grep -n 'windowLightNavigationBar' "$BASE_STYLES"; then
            echo "windowLightNavigationBar must be kept in values-v27/styles.xml, not base values/styles.xml." >&2
            exit 1
          fi
          test -f "$V27_STYLES"
          python3 - "$BASE_STYLES" "$V27_STYLES" <<'PYTHEME'
          import sys
          import xml.etree.ElementTree as ET
          base_root, v27_root = (ET.parse(path).getroot() for path in sys.argv[1:])
          def theme(root):
              matches = [node for node in root.findall("style") if node.get("name") == "Theme.VaultOS"]
              if len(matches) != 1:
                  raise SystemExit("Expected exactly one Theme.VaultOS style.")
              node = matches[0]
              return node, {item.get("name"): (item.text or "").strip() for item in node.findall("item")}
          base, base_items = theme(base_root)
          qualified, qualified_items = theme(v27_root)
          if qualified.get("parent") != base.get("parent"):
              raise SystemExit("values-v27 Theme.VaultOS must declare the same explicit parent as values/styles.xml.")
          missing = [name for name, value in base_items.items() if qualified_items.get(name) != value]
          if missing:
              raise SystemExit("values-v27 Theme.VaultOS is missing base theme items: " + ", ".join(missing))
          if qualified_items.get("android:windowLightNavigationBar") != "false":
              raise SystemExit("values-v27 Theme.VaultOS must set android:windowLightNavigationBar=false.")
          print("Theme.VaultOS base parent, inherited theme items, and API-27 navigation override verified.")
          PYTHEME
          grep -q 'tools:ignore="QueryAllPackagesPermission"' "$MANIFEST"
          echo "All previously reported lint and resource fixes are present."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests, lint and assemble
        run: gradle --no-daemon clean testDebugUnitTest lintDebug assembleDebug

      - name: Prepare APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/VaultOS-debug.apk
          cd dist
          sha256sum VaultOS-debug.apk > SHA256SUMS.txt
          {
            echo "VaultOS 0.1.0"
            echo "Build: ${GITHUB_RUN_NUMBER}"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Variant: debug (debug key; suitable for sideload testing)"
            echo "Target SDK: 35"
            echo "Minimum SDK: 26"
          } > BUILD-INFO.txt

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VaultOS-debug-APK
          path: dist/VaultOS-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload checksum and build information
        uses: actions/upload-artifact@v4
        with:
          name: VaultOS-build-metadata
          path: |
            dist/SHA256SUMS.txt
            dist/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30

      - name: Add build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VaultOS Android build"
            echo "- Device target: Redmi Note 12 Pro 5G / Android 13+"
            echo "- Compile SDK: 35"
            echo "- Java: 17"
            echo "- Gradle: 8.9"
            if [ -f dist/SHA256SUMS.txt ]; then
              echo "- APK SHA-256: $(cut -d ' ' -f1 dist/SHA256SUMS.txt)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VaultOS-build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
