name: VaultOS Android Build

on:
  push:
    branches:
      - "**"
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/android-build.yml"
      - "android-build.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer commit on the same branch supersedes an older in-flight build.
  group: vaultos-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Test and lint (no APK signing)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify lint-critical source fixes
        shell: bash
        run: |
          set -euo pipefail
          KEYBOARD_FILE="app/src/main/java/com/vaultos/app/keyboard/VaultKeyboardService.kt"
          MAIN_FILE="app/src/main/java/com/vaultos/app/MainActivity.kt"
          MANIFEST="app/src/main/AndroidManifest.xml"
          BASE_STYLES="app/src/main/res/values/styles.xml"
          V27_STYLES="app/src/main/res/values-v27/styles.xml"

          test -f "$KEYBOARD_FILE"
          if grep -nE 'switchToNextInputMethod[[:space:]]*\(' "$KEYBOARD_FILE"; then
            echo "API-28-only switchToNextInputMethod() remains in the checked-out source." >&2
            exit 1
          fi
          if grep -n 'produceState(initialValue = emptyList<File>()' "$MAIN_FILE"; then
            echo "Stale Compose produceState folder loader remains in MainActivity.kt." >&2
            exit 1
          fi
          if grep -n 'windowLightNavigationBar' "$BASE_STYLES"; then
            echo "windowLightNavigationBar must be kept in values-v27/styles.xml, not base values/styles.xml." >&2
            exit 1
          fi
          test -f "$V27_STYLES"
          python3 - "$BASE_STYLES" "$V27_STYLES" <<'PYTHEME'
          import sys
          import xml.etree.ElementTree as ET
          base_root, v27_root = (ET.parse(path).getroot() for path in sys.argv[1:])
          def theme(root):
              matches = [node for node in root.findall("style") if node.get("name") == "Theme.VaultOS"]
              if len(matches) != 1:
                  raise SystemExit("Expected exactly one Theme.VaultOS style.")
              node = matches[0]
              return node, {item.get("name"): (item.text or "").strip() for item in node.findall("item")}
          base, base_items = theme(base_root)
          qualified, qualified_items = theme(v27_root)
          if qualified.get("parent") != base.get("parent"):
              raise SystemExit("values-v27 Theme.VaultOS must declare the same explicit parent as values/styles.xml.")
          missing = [name for name, value in base_items.items() if qualified_items.get(name) != value]
          if missing:
              raise SystemExit("values-v27 Theme.VaultOS is missing base theme items: " + ", ".join(missing))
          if qualified_items.get("android:windowLightNavigationBar") != "false":
              raise SystemExit("values-v27 Theme.VaultOS must set android:windowLightNavigationBar=false.")
          print("Theme.VaultOS base parent, inherited theme items, and API-27 navigation override verified.")
          PYTHEME
          grep -q 'tools:ignore="QueryAllPackagesPermission"' "$MANIFEST"
          if grep -nE 'vaultos-stable\.keystore|vaultosStable|storePassword|keyPassword' app/build.gradle.kts; then
            echo "Routine CI must not reference the exposed historical signing identity." >&2
            exit 1
          fi
          echo "All previously reported lint, resource and signing-isolation checks are present."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Enable hardware acceleration for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "GitHub runner does not expose /dev/kvm; refusing to silently fall back to unusably slow TCG emulation." >&2
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests and lint without signing
        run: gradle --no-daemon clean testDebugUnitTest lintDebug

      - name: Add build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VaultOS Android build"
            echo "- Validation-only workflow: JVM tests and Android lint"
            echo "- No release APK is assembled, signed, uploaded or published by this workflow"
            echo "- API 35 instrumentation uses only the generated default Android debug signer for test APKs"
            echo "- Release signing remains blocked pending verified key rotation and update-lineage acceptance"
            echo "- Compile SDK: 35"
            echo "- Java: 17"
            echo "- Gradle: 8.9"
            if [ -f dist/SHA256SUMS.txt ]; then
              echo "- APK SHA-256: $(cut -d ' ' -f1 dist/SHA256SUMS.txt)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  android-instrumentation:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Android API 35 instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Enable hardware acceleration for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "GitHub runner does not expose /dev/kvm; refusing to silently fall back to unusably slow TCG emulation." >&2
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify instrumentation does not use the exposed signer
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'vaultos-stable\.keystore|vaultosStable|storePassword|keyPassword' app/build.gradle.kts; then
            echo "Instrumentation must never use the exposed historical signing identity." >&2
            exit 1
          fi

      - name: Run Android-backed persistence tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader -no-snapshot -wipe-data
          disable-animations: true
          script: |
            timeout 35m gradle --no-daemon connectedDebugAndroidTest

      - name: Capture emulator diagnostics after instrumentation
        if: always()
        shell: bash
        run: |
          mkdir -p app/build/ci-diagnostics
          timeout 20s adb devices -l > app/build/ci-diagnostics/devices.txt 2>&1 || true
          timeout 20s adb logcat -d -t 3000 > app/build/ci-diagnostics/final-logcat.txt 2>&1 || true
          timeout 20s adb shell dumpsys activity processes > app/build/ci-diagnostics/final-activity-processes.txt 2>&1 || true
          timeout 20s adb shell dumpsys package > app/build/ci-diagnostics/final-packages.txt 2>&1 || true

      - name: Upload Android instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VaultOS-android-instrumentation-diagnostics
          path: |
            app/build/ci-diagnostics/
            app/build/reports/androidTests/connected/debug/
          if-no-files-found: warn
          retention-days: 7
