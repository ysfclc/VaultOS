name: VaultOS Android Build

on:
  push:
    branches:
      - "**"
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/android-build.yml"
      - "android-build.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vaultos-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Test and lint (no APK signing)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify build variants do not reference exposed signing identity
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'vaultos-stable\.keystore|vaultosStable|storePassword|keyPassword' app/build.gradle.kts; then
            echo "CI must not reference the exposed historical signing identity." >&2
            exit 1
          fi

      - name: Run unit tests and lint without signing
        run: gradle --no-daemon clean testDebugUnitTest lintDebug

      - name: Add build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VaultOS Android validation"
            echo "- JVM unit tests and Android lint only"
            echo "- No APK assembly, signing, upload or draft-release publication"
            echo "- Release signing is disabled pending verified replacement-key lineage"
            echo "- Compile SDK: 35"
            echo "- Java: 17"
            echo "- Gradle: 8.9"
          } >> "$GITHUB_STEP_SUMMARY"

  android-instrumentation:
    name: Android API 35 instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify instrumentation does not use exposed signer
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'vaultos-stable\.keystore|vaultosStable|storePassword|keyPassword' app/build.gradle.kts; then
            echo "Instrumentation must not use the exposed historical signing identity." >&2
            exit 1
          fi

      - name: Run Android-backed typing memory tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle --no-daemon connectedDebugAndroidTest
